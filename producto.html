<body>
  {{> header}}
  <div class="greca greca--top"></div>

  <main>
    <div id="product-root"></div>

    <section class="section section--tight" id="product-cta">
      <div class="container">

          <div>

        </div>
      </div>
    </section>

    <section class="section" id="related">
      <div class="container">
        <div class="section-head"><p class="eyebrow">También te puede gustar</p><h2>Productos relacionados</h2></div>
        <div class="grid-products" id="related-grid"></div>
      </div>
    </section>
  </main>

  <div class="greca"></div>

  {{> footer}}

  <button class="to-top" data-to-top aria-label="Volver arriba"></button>
  <a class="wa-float" data-wa-general target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp">
